workflows:
  ferchester-car-unsigned-ipa:
    name: FERCHOSTER CAR - iOS 12 unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build app for iPhone
        script: |
          set -e
          xcodebuild \
            -project FERCHOSTER_CAR.xcodeproj \
            -scheme FERCHOSTER_CAR \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA for Sideloadly
        script: |
          set -e
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/FERCHOSTER CAR.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          /usr/bin/zip -qry FERCHOSTER_CAR_unsigned.ipa Payload
          echo "Unsigned IPA created at build/FERCHOSTER_CAR_unsigned.ipa"
    artifacts:
      - build/FERCHOSTER_CAR_unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
